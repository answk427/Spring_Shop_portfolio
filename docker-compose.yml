services:
  # 1. 로컬 개발용 MySQL
  db:
    image: mysql:8.0
    container_name: local-db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=asdf      # 인텔리제이 설정과 맞출 것
      - MYSQL_DATABASE=trade_db
    volumes:
      - ./mysql_data:/var/lib/mysql    # 데이터 보존용 볼륨

  # 2. 로컬 개발용 Redis
  redis:
    image: redis:alpine
    container_name: local-redis
    ports:
      - "6379:6379"